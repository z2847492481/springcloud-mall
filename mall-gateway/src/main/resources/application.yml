server:
  port: 8080

spring:
  application:
    name: mall-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
    gateway:
      discovery:
        locator:
          enabled: false
      # 默认过滤器对所有路由生效：Redis 令牌桶限流
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
            status-code: TOO_MANY_REQUESTS
      routes:
        - id: mall-user
          uri: lb://mall-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: mall-product
          uri: lb://mall-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: mall-stock
          uri: lb://mall-stock
          predicates:
            - Path=/api/stock/**
          filters:
            - StripPrefix=1
        - id: mall-order
          uri: lb://mall-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: mall-wms
          uri: lb://mall-wms
          predicates:
            - Path=/api/wms/**
          filters:
            - StripPrefix=1

mall:
  jwt:
    # 必须与 mall-user 保持一致，后续迁移到 Nacos 配置中心
    secret: mall-cloud-demo-jwt-secret-key-0123456789abcdef
    expire-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always